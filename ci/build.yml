# Copy this file to .github/workflows/build.yml in the GitHub web interface to enable automated CI.
name: build

on:
  push:
    branches: [main, improvements]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  LLVM_MINGW_VERSION: "20261020"

jobs:
  stub-check:
    # Cross-platform compilation & wine unit testing on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm-mingw
        run: |
          curl -sSL -o llvm.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          tar xf llvm.tar.xz
          echo "$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Wine runner
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine64 || true

      - name: Compile and run test suite
        run: |
          x86_64-w64-mingw32-clang++ -std=c++23 -O1 -Wall -Wextra -Wno-unused-parameter -I. \
            -municode -DDYNAMIC_ISLAND_STANDALONE -DUNICODE -D_UNICODE \
            -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 -D_WIN32_IE=0x0A00 -DNTDDI_VERSION=0x0A000008 \
            -D__USE_MINGW_ANSI_STDIO=0 -include standalone_shim.h tests/standalone_stub_check.cpp \
            -lole32 -lshell32 -luser32 -ladvapi32 -lshcore -ldwmapi -lgdi32 -lcomctl32 -luxtheme -static -o stub.exe
          wine ./stub.exe || wine64 ./stub.exe

  exe:
    # Native Windows release build & test execution
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $v = $env:LLVM_MINGW_VERSION
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile llvm.zip
          Expand-Archive llvm.zip -DestinationPath C:\
          $dir = (Get-ChildItem C:\ -Directory -Filter "llvm-mingw-*" | Select-Object -First 1).FullName
          "DI_TOOLCHAIN=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate C++/WinRT headers (Windows SDK)
        shell: pwsh
        run: |
          $d = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
               Where-Object { Test-Path "$($_.FullName)\cppwinrt\winrt\base.h" } |
               Sort-Object Name | Select-Object -Last 1
          if (-not $d) { throw "No Windows SDK with C++/WinRT headers found" }
          "DI_CPPWINRT=$($d.FullName)\cppwinrt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Using $($d.FullName)\cppwinrt"

      - name: Run native test suite
        shell: pwsh
        run: |
          & "$env:DI_TOOLCHAIN\bin\clang++.exe" -std=c++23 -O1 -Wall -Wextra -Wno-unused-parameter -I. `
            -municode -DDYNAMIC_ISLAND_STANDALONE -DUNICODE -D_UNICODE `
            -DWINVER=0x0A00 -D_WIN32_WINNT=0x0A00 -D_WIN32_IE=0x0A00 -DNTDDI_VERSION=0x0A000008 `
            -include standalone_shim.h tests/standalone_stub_check.cpp `
            -lole32 -lshell32 -luser32 -ladvapi32 -lshcore -ldwmapi -lgdi32 -lcomctl32 -luxtheme -static -o test_stub.exe
          .\test_stub.exe

      - name: Build release executable
        run: python build.py --out DynamicIsland.exe

      - name: Verify imports and manifest
        run: |
          pip install pefile
          python tools/check_imports.py DynamicIsland.exe

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash DynamicIsland.exe -Algorithm SHA256).Hash.ToLower() + "  DynamicIsland.exe" | Out-File DynamicIsland.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland
          path: |
            DynamicIsland.exe
            DynamicIsland.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" DynamicIsland.exe DynamicIsland.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
